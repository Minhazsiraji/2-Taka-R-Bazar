name: Step 1 CI

on:
  push:
    branches: [main, feat/finance-treasury-integrated-20261009]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Production dependency security audit
        id: security_audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Domain tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Enforce dependency security gate
        if: steps.security_audit.outcome != 'success'
        run: |
          echo "Production dependency security audit failed earlier in this job."
          exit 1

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start disposable local Supabase
        run: supabase start
      - name: Apply migrations from zero
        run: supabase db reset
      - name: Finance and Treasury synthetic pgTAP UAT
        run: supabase test db
      - name: Synthetic supply handover E2E
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/supply-handover-e2e.sql
      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --no-backup
