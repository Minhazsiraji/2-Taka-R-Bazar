name: Step 1 CI

on:
  push:
    branches: [main, feat/finance-treasury-integrated-20261009, feat/finance-complete-release-uat-20261011, feat/storefront-home-integration-20261012]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Production dependency security audit
        id: security_audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Approved Home design lock
        run: node scripts/check-home-design-lock.mjs
      - name: Domain tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Enforce dependency security gate
        if: steps.security_audit.outcome != 'success'
        run: |
          echo "Production dependency security audit failed earlier in this job."
          exit 1

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Start disposable local Supabase
        run: supabase start
      - name: Apply migrations from zero
        run: |
          supabase db reset
          # Disposable fixtures must never execute the operational hosted push schedules.
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "select cron.alter_job(job_id := jobid, active := false) from cron.job;"
      - name: Finance and Treasury synthetic pgTAP UAT
        run: supabase test db
      - name: Synthetic supply handover E2E
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/supply-handover-e2e.sql
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install isolated storefront browser tooling
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.56.0
          npx playwright install --with-deps chromium
      # Disposable localhost storage uses HTTP; this CI-only change runs AFTER pgTAP.
      # Never place this exception in a schema migration or on hosted Supabase.
      - name: Allow local loopback image URLs in browser-test database only
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "select pg_get_constraintdef(oid) from pg_constraint where conrelid='public.product_seo_media'::regclass and conname='product_seo_media_url_check'" | grep -Fq '^https://'
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "ALTER TABLE public.product_seo_media DROP CONSTRAINT product_seo_media_url_check; ALTER TABLE public.product_seo_media ADD CONSTRAINT product_seo_media_url_check CHECK (length(url)<=1200 AND (url LIKE 'https://%' OR url LIKE 'http://127.0.0.1:%/storage/v1/object/public/product-images/%'));"
      - name: Production-build storefront UAT against disposable synthetic DB
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source <(supabase status -o env)
          set +a
          echo "::add-mask::${SERVICE_ROLE_KEY}"
          echo "::add-mask::${ANON_KEY}"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY"
          export LOCAL_SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000
          export VERCEL_ENV=production
          npm run build
          npm run start -- --hostname 127.0.0.1 >/tmp/2tbr-storefront-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:3000/ -o /dev/null; then break; fi
            sleep 1
          done
          node tests/storefront-browser-uat.mjs
          node tests/account-security-browser-uat.mjs
          node tests/product-seo-browser-uat.mjs
          node tests/pilot-booking-public-smoke.mjs
          node tests/simple-offers-browser-uat.mjs
      - name: Upload synthetic account and header screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-dashboard-screenshots
          path: |
            /tmp/2tbr-account-*.png
            /tmp/2tbr-header-*.png
            /tmp/2tbr-product-seo-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --no-backup
