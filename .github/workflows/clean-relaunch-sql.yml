name: Clean Relaunch Isolated SQL

on:
  push:
    branches:
      - rebuild/clean-storefront-pilot-v2
    paths:
      - 'relaunch/sql/**'
      - 'relaunch/tests/**'
      - '.github/workflows/clean-relaunch-sql.yml'
  pull_request:
    paths:
      - 'relaunch/sql/**'
      - 'relaunch/tests/**'
      - '.github/workflows/clean-relaunch-sql.yml'

permissions:
  contents: read

jobs:
  isolated-schema:
    name: Disposable Postgres security and checkout checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start fresh isolated Postgres
        run: docker run -d --name 2tbr-relaunch-postgres -e POSTGRES_PASSWORD=postgres postgres:17-alpine
      - name: Wait for Postgres
        run: |
          for n in $(seq 1 90); do
            if docker exec 2tbr-relaunch-postgres pg_isready -U postgres; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Apply fresh schema and exercise customer/admin checkout
        run: |
          cat relaunch/tests/auth_stub.sql relaunch/sql/001_clean_store_schema.sql relaunch/tests/schema_smoke.sql \
            | docker exec -i 2tbr-relaunch-postgres psql -U postgres -d postgres -v ON_ERROR_STOP=1
      - name: Shut down disposable database
        if: always()
        run: docker rm -f 2tbr-relaunch-postgres || true
